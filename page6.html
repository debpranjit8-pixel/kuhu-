<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yeahh 😌</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;900&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}


body{

height:100vh;
overflow:hidden;

background:#000;

display:flex;
justify-content:center;
align-items:center;

color:white;

}



/* Animated background */

body:before{

content:"";

position:absolute;

width:600px;
height:600px;

background:#ff003c;

filter:blur(180px);

opacity:.25;

animation:bgmove 6s infinite alternate;

}


@keyframes bgmove{

from{
transform:translate(-250px,-150px);
}

to{
transform:translate(250px,150px);
}

}




.particles span{

position:absolute;

width:8px;
height:8px;

background:#ff003c;

border-radius:50%;

box-shadow:0 0 20px #ff003c;

animation:float 8s infinite;

}



@keyframes float{

0%{
transform:translateY(100vh) scale(0);
opacity:0;
}

50%{
opacity:1;
}

100%{
transform:translateY(-100vh) scale(1.5);
opacity:0;
}

}




.container{

position:relative;

z-index:5;

width:90%;

max-width:850px;

padding:45px 25px;

text-align:center;

background:

linear-gradient(
135deg,
rgba(255,255,255,.12),
rgba(255,0,60,.08)
);

border:2px solid rgba(255,0,60,.5);

border-radius:35px;

backdrop-filter:blur(20px);


box-shadow:

0 0 80px rgba(255,0,60,.35);


animation:

cardPop 1s cubic-bezier(.17,.67,.3,1.5);

}



@keyframes cardPop{

0%{

transform:scale(.3) rotateX(60deg);

opacity:0;

}

100%{

transform:scale(1);

opacity:1;

}

}




.text{

font-size:clamp(2rem,5vw,4rem);

font-weight:900;

line-height:1.5;

}



.word{

display:inline-block;

margin:5px;

opacity:0;

transform:

translateY(80px)
scale(.5)
rotate(-10deg);


animation:wordPop .7s forwards;

}



@keyframes wordPop{


50%{

transform:

translateY(-20px)
scale(1.15)
rotate(5deg);

}


100%{

opacity:1;

transform:

translateY(0)
scale(1)
rotate(0);

}


}




.red{

color:#ff003c;

text-shadow:

0 0 15px #ff003c,

0 0 40px #ff003c;

}





button{


margin-top:45px;


padding:20px 75px;


background:#000;


color:white;


font-size:1.4rem;


font-weight:900;


letter-spacing:3px;


border-radius:60px;


border:3px solid #ff003c;


cursor:pointer;


position:relative;


overflow:hidden;


box-shadow:

0 0 30px #ff003c;



animation:

buttonPop 1s 2.8s backwards;


}



button:before{

content:"";

position:absolute;

left:-100%;

top:0;

height:100%;

width:100%;

background:#ff003c;

transition:.5s;

z-index:-1;

}



button:hover:before{

left:0;

}


button:hover{

transform:scale(1.12);

}



@keyframes buttonPop{

from{

opacity:0;

transform:scale(0);

}

to{

opacity:1;

transform:scale(1);

}

}


</style>

</head>


<body>



<div class="particles">

<span style="left:10%;animation-delay:0s"></span>
<span style="left:30%;animation-delay:2s"></span>
<span style="left:50%;animation-delay:4s"></span>
<span style="left:70%;animation-delay:1s"></span>
<span style="left:90%;animation-delay:3s"></span>

</div>




<div class="container">


<div class="text" id="text"></div>


<button onclick="location.href='page7.html'">

LET'S GO 🔥

</button>


</div>





<script>


const message =
"Yeahh ik u love him 😌😌 Don't bother to click on no 😏 Wanna continue??";


const box=document.getElementById("text");


let time=0;


message.split(" ").forEach(word=>{


let span=document.createElement("span");


span.className="word";

span.textContent=word;


span.style.animationDelay=time+"ms";



if(
word.includes("love") ||
word.includes("no") ||
word.includes("😌") ||
word.includes("😏")
){

span.classList.add("red");

}


box.appendChild(span);


time+=180;


});



</script>


</body>
</html>
