<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0">

<title>Birthday Surprise 🎂</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

html,body{

width:100%;
height:100%;
overflow:hidden;

}

body{

display:flex;
justify-content:center;
align-items:center;

background:
linear-gradient(
135deg,
#040404,
#12000b,
#2d0016,
#630030,
#ff005d
);

position:relative;

}

/* ==========================
BACKGROUND GLOW
========================== */

body::before{

content:"";

position:absolute;

width:700px;
height:700px;

border-radius:50%;

background:
radial-gradient(
circle,
rgba(255,0,120,.35),
transparent 70%
);

animation:
backgroundGlow
7s infinite alternate;

}

@keyframes backgroundGlow{

0%{

transform:scale(1);
opacity:.45;

}

100%{

transform:scale(1.45);
opacity:1;

}

}

/* ==========================
FLOATING STARS
========================== */

#stars{

position:absolute;

left:0;
top:0;

width:100%;
height:100%;

overflow:hidden;

pointer-events:none;

z-index:1;

}

.star{

position:absolute;

width:3px;
height:3px;

background:white;

border-radius:50%;

animation:
twinkle
3s infinite;

}

@keyframes twinkle{

0%{

opacity:.2;
transform:scale(.5);

}

50%{

opacity:1;
transform:scale(1.7);

}

100%{

opacity:.2;
transform:scale(.5);

}

}

/* ==========================
MAIN CONTAINER
========================== */

.container{

position:relative;

z-index:10;

text-align:center;

}

/* ==========================
BIRTHDAY TITLE
(HIDDEN AT FIRST)
========================== */

#birthdayTitle{

display:none;

position:fixed;

left:50%;
top:50%;

transform:
translate(-50%,-50%);

font-size:60px;

font-weight:bold;

color:white;

text-align:center;

text-shadow:

0 0 20px hotpink,

0 0 40px deeppink,

0 0 80px red,

0 0 130px #ff0055;

z-index:999;

animation:
titleGlow
2s infinite;

}

@keyframes titleGlow{

0%{

text-shadow:

0 0 15px hotpink;

}

50%{

text-shadow:

0 0 30px hotpink,

0 0 60px deeppink,

0 0 110px red,

0 0 180px #ff0055;

}

100%{

text-shadow:

0 0 15px hotpink;

}

}
/* ==========================
CAKE
========================== */

.cake{

position:relative;

width:280px;
height:240px;

margin:auto;

animation:
cakeFloat 3s ease-in-out infinite;

transition:1.2s ease;

}

@keyframes cakeFloat{

0%,100%{

transform:translateY(0);

}

50%{

transform:translateY(-12px);

}

}

/* ==========================
CAKE LAYERS
========================== */

.layer{

position:absolute;

left:50%;

transform:translateX(-50%);

border-radius:18px;

box-shadow:
0 12px 30px rgba(0,0,0,.35);

}

.bottom-layer{

bottom:0;

width:260px;
height:75px;

background:
linear-gradient(
180deg,
#ff76b8,
#d00052
);

}

.middle-layer{

bottom:65px;

width:220px;
height:65px;

background:
linear-gradient(
180deg,
#ffd7ea,
#ff5ea3
);

}

.top-layer{

bottom:120px;

width:170px;
height:58px;

background:
linear-gradient(
180deg,
#ffffff,
#ffc6e2
);

}

/* ==========================
ICING
========================== */

.icing{

position:absolute;

top:-8px;
left:0;

width:100%;
height:18px;

border-radius:50%;

background:
linear-gradient(
90deg,
#ffffff,
#ffe6f2
);

}

/* ==========================
CANDLES
========================== */

.candles{

position:absolute;

left:50%;
top:-60px;

transform:translateX(-50%);

display:flex;

gap:26px;

}

.candle{

width:12px;
height:58px;

border-radius:6px;

background:
linear-gradient(
180deg,
#ff0055,
#ffb5d6
);

position:relative;

opacity:0;

animation:
candleRise .8s forwards;

}

.candle:nth-child(1){

animation-delay:.4s;

}

.candle:nth-child(2){

animation-delay:.9s;

}

.candle:nth-child(3){

animation-delay:1.4s;

}

@keyframes candleRise{

from{

opacity:0;
transform:translateY(40px);

}

to{

opacity:1;
transform:translateY(0);

}

}

/* ==========================
FLAMES
========================== */

.flame{

position:absolute;

left:50%;
top:-24px;

transform:
translateX(-50%)
rotate(45deg);

width:16px;
height:24px;

border-radius:
50% 50% 50% 0;

background:
linear-gradient(
yellow,
orange
);

box-shadow:

0 0 12px yellow,

0 0 24px orange,

0 0 40px red;

animation:
flameFlicker
.25s infinite alternate;

}

@keyframes flameFlicker{

from{

transform:
translateX(-50%)
rotate(45deg)
scale(1);

}

to{

transform:
translateX(-50%)
rotate(45deg)
scale(1.18);

}

}
/* ==========================
BLOW CARD
========================== */

.blowCard{

margin-top:45px;

padding:22px 38px;

border-radius:28px;

background:rgba(255,255,255,.08);

border:1px solid rgba(255,255,255,.18);

backdrop-filter:blur(18px);

-webkit-backdrop-filter:blur(18px);

box-shadow:

0 0 30px rgba(255,0,100,.35);

animation:

cardFloat 3s ease-in-out infinite;

}

@keyframes cardFloat{

0%,100%{

transform:translateY(0);

}

50%{

transform:translateY(-8px);

}

}

.blowCard h2{

color:#fff;

font-size:28px;

margin-bottom:10px;

}

#status{

color:#ffd8ec;

font-size:17px;

}

/* ==========================
NEXT BUTTON
========================== */

#nextBtn{

display:none;

margin-top:30px;

padding:15px 42px;

border:none;

border-radius:40px;

cursor:pointer;

font-size:18px;

font-weight:bold;

color:white;

background:

linear-gradient(
90deg,
#ff0055,
#ff79bc
);

box-shadow:

0 0 25px #ff3b8d;

transition:.35s;

}

#nextBtn:hover{

transform:scale(1.08);

}

/* ==========================
EFFECT CONTAINERS
========================== */

#smokeContainer,
#confettiContainer,
#fireworksContainer,
#balloonContainer,
#heartContainer,
#sparkleContainer{

position:fixed;

left:0;
top:0;

width:100%;
height:100%;

pointer-events:none;

overflow:hidden;

}

/* ==========================
SMOKE
========================== */

.smoke{

position:absolute;

width:18px;
height:18px;

border-radius:50%;

background:rgba(255,255,255,.75);

animation:

smokeRise 3s forwards;

}

@keyframes smokeRise{

0%{

opacity:1;

transform:
translate(0,0)
scale(.4);

}

100%{

opacity:0;

transform:
translate(var(--x),-140px)
scale(2.8);

}

}

/* ==========================
CONFETTI
========================== */

.confetti{

position:absolute;

width:10px;

height:18px;

border-radius:3px;

}

/* ==========================
BALLOONS
========================== */

.balloon{

position:absolute;

font-size:38px;

}

/* ==========================
HEARTS
========================== */

.heart{

position:absolute;

font-size:28px;

}

/* ==========================
SPARKLES
========================== */

.sparkle{

position:absolute;

font-size:20px;

}

/* ==========================
MOBILE
========================== */

@media(max-width:600px){

.cake{

transform:scale(.82);

}

#birthdayTitle{

font-size:38px;

}

.blowCard{

padding:18px 22px;

}

.blowCard h2{

font-size:22px;

}

#status{

font-size:15px;

}

}

/* ===== END OF CSS ===== */

</style>
</head>

<body>

<!-- ⭐ Background Stars -->
<div id="stars"></div>

<!-- 🎊 Effect Containers -->
<div id="smokeContainer"></div>

<div id="confettiContainer"></div>

<div id="fireworksContainer"></div>

<div id="balloonContainer"></div>

<div id="heartContainer"></div>

<div id="sparkleContainer"></div>

<!-- 🎂 Main Container -->
<div class="container">

<!-- Hidden Birthday Title -->
<h1 id="birthdayTitle">

🎉 Happy Birthday<br>

Sholankini 🎂

</h1>

<!-- Cake -->
<div class="cake" id="cake">

<!-- Candles -->
<div class="candles">

<div class="candle">

<div class="flame"></div>

</div>

<div class="candle">

<div class="flame"></div>

</div>

<div class="candle">

<div class="flame"></div>

</div>

</div>

<!-- Top Layer -->
<div class="layer top-layer">

<div class="icing"></div>

</div>

<!-- Middle Layer -->
<div class="layer middle-layer">

<div class="icing"></div>

</div>

<!-- Bottom Layer -->
<div class="layer bottom-layer">

<div class="icing"></div>

</div>

</div>

<!-- Blow Card -->
<div class="blowCard">

<h2>

💨 Blow the Candles

</h2>

<p id="status">

Tap anywhere to start the microphone

</p>

</div>

<!-- Continue Button -->

<button id="nextBtn">

Continue →

</button>

</div>

<script>
// =====================================
// ELEMENTS
// =====================================

const cake=document.getElementById("cake");

const birthdayTitle=document.getElementById("birthdayTitle");

const status=document.getElementById("status");

const nextBtn=document.getElementById("nextBtn");

const flames=document.querySelectorAll(".flame");

const smokeContainer=document.getElementById("smokeContainer");

const confettiContainer=document.getElementById("confettiContainer");

const fireworksContainer=document.getElementById("fireworksContainer");

const balloonContainer=document.getElementById("balloonContainer");

const heartContainer=document.getElementById("heartContainer");

const sparkleContainer=document.getElementById("sparkleContainer");

let blown=false;

// =====================================
// CREATE STARS
// =====================================

createStars();

function createStars(){

const stars=document.getElementById("stars");

for(let i=0;i<100;i++){

const star=document.createElement("div");

star.className="star";

star.style.left=Math.random()*100+"vw";

star.style.top=Math.random()*100+"vh";

star.style.animationDelay=Math.random()*3+"s";

star.style.animationDuration=(2+Math.random()*3)+"s";

stars.appendChild(star);

}

}

// =====================================
// START MICROPHONE
// =====================================

document.body.addEventListener(

"click",

startMicrophone,

{once:true}

);

async function startMicrophone(){

try{

const stream=

await navigator.mediaDevices.getUserMedia({

audio:true

});

status.innerHTML=

"🎤 Listening... Blow gently 💨";

const audioContext=

new AudioContext();

const microphone=

audioContext.createMediaStreamSource(stream);

const analyser=

audioContext.createAnalyser();

microphone.connect(analyser);

analyser.fftSize=256;

const data=

new Uint8Array(

analyser.frequencyBinCount

);

listenForBlow(

analyser,

data

);

}

catch(error){

status.innerHTML=

"❌ Microphone permission denied";

}

}
// =====================================
// BLOW DETECTION
// =====================================

function listenForBlow(analyser,data){

analyser.getByteFrequencyData(data);

let volume=0;

for(let i=0;i<data.length;i++){

volume+=data[i];

}

volume/=data.length;

if(volume>22 && !blown){

blown=true;

blowCandles();

return;

}

requestAnimationFrame(function(){

listenForBlow(analyser,data);

});

}

// =====================================
// BLOW CANDLES
// =====================================

function blowCandles(){

status.innerHTML="🌬️ Blowing...";

flames.forEach((flame,index)=>{

setTimeout(()=>{

flame.animate([

{
opacity:1,
transform:"translateX(-50%) rotate(45deg) scale(1)"
},

{
opacity:.5,
transform:"translateX(-50%) rotate(45deg) scale(.6)"
},

{
opacity:0,
transform:"translateX(-50%) rotate(45deg) scale(0)"
}

],{

duration:450,
fill:"forwards"

});

createSmoke(flame);

},index*250);

});

setTimeout(screenFlash,1200);

}

// =====================================
// SMOKE
// =====================================

function createSmoke(flame){

const rect=flame.getBoundingClientRect();

for(let i=0;i<12;i++){

const puff=document.createElement("div");

puff.className="smoke";

puff.style.left=(rect.left+Math.random()*10)+"px";

puff.style.top=rect.top+"px";

puff.style.setProperty(

"--x",

(Math.random()-.5)*100+"px"

);

smokeContainer.appendChild(puff);

setTimeout(()=>{

puff.remove();

},3000);

}

}

// =====================================
// SCREEN FLASH
// =====================================

function screenFlash(){

const flash=document.createElement("div");

flash.style.position="fixed";
flash.style.left="0";
flash.style.top="0";
flash.style.width="100%";
flash.style.height="100%";
flash.style.background="white";
flash.style.opacity="0";
flash.style.pointerEvents="none";
flash.style.zIndex="9999";

document.body.appendChild(flash);

flash.animate([

{opacity:0},

{opacity:1},

{opacity:0}

],{

duration:500,
fill:"forwards"

});

// Camera shake

document.body.animate([

{transform:"translateX(0)"},

{transform:"translateX(-8px)"},

{transform:"translateX(8px)"},

{transform:"translateX(-6px)"},

{transform:"translateX(6px)"},

{transform:"translateX(0)"}

],{

duration:500

});

setTimeout(()=>{

flash.remove();

cake.animate([

{
opacity:1,
transform:"scale(1)"
},

{
opacity:0,
transform:"scale(.4)"
}

],{

duration:1200,
fill:"forwards"

});

setTimeout(()=>{

cake.style.display="none";

launchConfetti();

},1000);

},300);

}
// =====================================
// CONFETTI
// =====================================

function launchConfetti(){

for(let i=0;i<320;i++){

const piece=document.createElement("div");

piece.className="confetti";

piece.style.left=Math.random()*100+"vw";

piece.style.top="-30px";

piece.style.width=(6+Math.random()*8)+"px";

piece.style.height=(10+Math.random()*15)+"px";

piece.style.background=
`hsl(${Math.random()*360},100%,60%)`;

confettiContainer.appendChild(piece);

const x=(Math.random()-.5)*700;

const y=window.innerHeight+250;

piece.animate([

{
transform:"translate(0,0) rotate(0deg)",
opacity:1
},

{
transform:
`translate(${x}px,${y}px)
rotate(${Math.random()*1440}deg)`,

opacity:1

}

],{

duration:2500+Math.random()*2500,

fill:"forwards",

easing:"ease-in"

});

setTimeout(()=>{

piece.remove();

},5200);

}

// Start all celebration effects

setTimeout(()=>{

launchFireworks();

launchBalloons();

launchHearts();

launchSparkles();

revealBirthday();

},1700);

}
// =====================================
// FIREWORKS
// =====================================

function launchFireworks(){

for(let i=0;i<12;i++){

setTimeout(()=>{

const firework=document.createElement("div");

firework.innerHTML="🎆";

firework.style.position="fixed";

firework.style.left=(5+Math.random()*90)+"vw";

firework.style.top=(5+Math.random()*45)+"vh";

firework.style.fontSize=(40+Math.random()*35)+"px";

firework.style.zIndex="1000";

firework.style.pointerEvents="none";

fireworksContainer.appendChild(firework);

firework.animate([

{
opacity:0,
transform:"scale(.2)"
},

{
opacity:1,
transform:"scale(1.8)"
},

{
opacity:0,
transform:"scale(3)"
}

],{

duration:1800,
fill:"forwards"

});

setTimeout(()=>{

firework.remove();

},1800);

},i*220);

}

}

// =====================================
// BALLOONS
// =====================================

function launchBalloons(){

const balloons=["🎈","🎈","🎈","🎈","🎈"];

for(let i=0;i<20;i++){

const balloon=document.createElement("div");

balloon.className="balloon";

balloon.innerHTML=

balloons[Math.floor(Math.random()*balloons.length)];

balloon.style.left=Math.random()*100+"vw";

balloon.style.bottom="-100px";

balloon.style.fontSize=(35+Math.random()*25)+"px";

balloonContainer.appendChild(balloon);

balloon.animate([

{
transform:"translateY(0)"
},

{
transform:"translateY(-130vh)"
}

],{

duration:7000+Math.random()*3000,

fill:"forwards",

easing:"linear"

});

setTimeout(()=>{

balloon.remove();

},10000);

}

}

// =====================================
// HEARTS
// =====================================

function launchHearts(){

setInterval(()=>{

const heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="💖";

heart.style.left=Math.random()*100+"vw";

heart.style.bottom="-40px";

heart.style.fontSize=(22+Math.random()*18)+"px";

heartContainer.appendChild(heart);

heart.animate([

{
transform:"translateY(0)",
opacity:1
},

{
transform:"translateY(-120vh)",
opacity:0
}

],{

duration:4500,

fill:"forwards"

});

setTimeout(()=>{

heart.remove();

},4500);

},350);

}

// =====================================
// SPARKLES
// =====================================

function launchSparkles(){

setInterval(()=>{

const sparkle=document.createElement("div");

sparkle.className="sparkle";

sparkle.innerHTML="✨";

sparkle.style.left=Math.random()*100+"vw";

sparkle.style.top="-30px";

sparkle.style.fontSize=(18+Math.random()*12)+"px";

sparkleContainer.appendChild(sparkle);

sparkle.animate([

{
transform:"translateY(0)",
opacity:1
},

{
transform:"translateY(120vh)",
opacity:0
}

],{

duration:3500,

fill:"forwards"

});

setTimeout(()=>{

sparkle.remove();

},3500);

},120);

}
// =====================================
// BIRTHDAY REVEAL
// =====================================

function revealBirthday(){

birthdayTitle.style.display="block";

birthdayTitle.animate([

{
opacity:0,
transform:"translate(-50%,-50%) scale(.2) rotate(-15deg)"
},

{
opacity:1,
transform:"translate(-50%,-50%) scale(1.25) rotate(5deg)"
},

{
opacity:1,
transform:"translate(-50%,-50%) scale(1)"
}

],{

duration:2200,
fill:"forwards",
easing:"ease-out"

});

// Continuous fireworks

setInterval(()=>{

launchFireworks();

},4500);

// Show button after title animation

setTimeout(()=>{

status.innerHTML="🎉 Happy Birthday Sholankini! 🎂";

nextBtn.style.display="inline-block";

nextBtn.animate([

{
opacity:0,
transform:"translateY(40px) scale(.8)"
},

{
opacity:1,
transform:"translateY(0) scale(1)"
}

],{

duration:900,
fill:"forwards"

});

},1800);

}

// =====================================
// CONTINUE BUTTON
// =====================================

nextBtn.addEventListener("click",()=>{

window.location.href="page3.html";

});

</script>

</body>

</html>
