<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Birthday Surprise 🎂</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


html,body{

width:100%;
height:100%;

overflow:hidden;

}



body{

display:flex;
justify-content:center;
align-items:center;

background:
linear-gradient(
135deg,
#040404,
#12000b,
#2d0016,
#630030,
#ff005d
);

position:relative;

}



/* BACKGROUND GLOW */

body::before{

content:"";

position:absolute;

width:600px;

height:600px;

border-radius:50%;

background:
radial-gradient(
circle,
rgba(255,0,120,.3),
transparent 70%
);

animation:
backgroundGlow 8s infinite alternate;

}



@keyframes backgroundGlow{

from{

transform:scale(1);

opacity:.5;

}


to{

transform:scale(1.35);

opacity:.9;

}

}




/* STARS */

#stars{

position:absolute;

inset:0;

overflow:hidden;

pointer-events:none;

z-index:1;

}



.star{

position:absolute;

width:3px;

height:3px;

background:white;

border-radius:50%;

animation:twinkle 3s infinite;

}



@keyframes twinkle{

50%{

opacity:1;

transform:scale(1.5);

}

}





/* MAIN */

.container{

position:relative;

z-index:10;

text-align:center;

display:flex;

flex-direction:column;

align-items:center;

justify-content:center;

height:100%;

width:100%;

}





/* TITLE */

#birthdayTitle{

display:none;

position:fixed;

left:50%;

top:45%;

transform:
translate(-50%,-50%);


font-size:60px;

font-weight:900;

color:white;


text-align:center;


text-shadow:

0 0 20px hotpink,
0 0 50px deeppink,
0 0 100px red;


z-index:999;


animation:titleGlow 2s infinite;

}



@keyframes titleGlow{

50%{

text-shadow:

0 0 40px hotpink,
0 0 80px red;

}

}




/* CAKE */

.cake{

position:relative;

width:280px;

height:240px;

margin:auto;


animation:
cakeFloat 3s infinite ease-in-out;

}



@keyframes cakeFloat{

50%{

transform:translateY(-10px);

}

}




/* CAKE LAYERS */


.layer{

position:absolute;

left:50%;

transform:translateX(-50%);

border-radius:18px;

box-shadow:
0 10px 25px rgba(0,0,0,.4);

}




.bottom-layer{

bottom:0;

width:260px;

height:75px;

background:
linear-gradient(
#ff76b8,
#d00052
);

}




.middle-layer{

bottom:65px;

width:220px;

height:65px;

background:
linear-gradient(
#ffd7ea,
#ff5ea3
);

}




.top-layer{

bottom:120px;

width:170px;

height:58px;

background:
linear-gradient(
#fff,
#ffc6e2
);

}




.icing{

position:absolute;

top:-8px;

width:100%;

height:18px;

border-radius:50%;

background:white;

}

/* ==========================
CANDLES
========================== */


.candles{

position:absolute;

top:-60px;

left:50%;

transform:translateX(-50%);

display:flex;

gap:26px;

}



.candle{

width:12px;

height:58px;

border-radius:6px;

background:
linear-gradient(
#ff0055,
#ffb5d6
);


opacity:0;

animation:
candleRise .8s forwards;

}



.candle:nth-child(1){

animation-delay:.4s;

}


.candle:nth-child(2){

animation-delay:.9s;

}


.candle:nth-child(3){

animation-delay:1.4s;

}




@keyframes candleRise{


from{

opacity:0;

transform:translateY(40px);

}


to{

opacity:1;

transform:translateY(0);

}

}





/* FLAME */


.flame{

position:absolute;

left:50%;

top:-24px;

width:16px;

height:24px;


transform:
translateX(-50%)
rotate(45deg);


border-radius:
50% 50% 50% 0;


background:
linear-gradient(
yellow,
orange
);


box-shadow:

0 0 12px yellow,
0 0 30px orange;


animation:
flame .3s infinite alternate;

}



@keyframes flame{


to{

transform:
translateX(-50%)
rotate(45deg)
scale(1.15);

}

}





/* ==========================
BLOW CARD
========================== */


.blowCard{

margin-top:45px;

padding:22px 38px;

border-radius:28px;


background:
rgba(255,255,255,.08);


border:

1px solid rgba(255,255,255,.2);


backdrop-filter:blur(15px);


box-shadow:

0 0 30px rgba(255,0,100,.35);

}



.blowCard h2{

color:white;

font-size:28px;

}



#status{

color:#ffd8ec;

margin-top:10px;

}





/* ==========================
CONTINUE BUTTON
========================== */


#nextBtn{

display:none;

position:fixed;

bottom:40px;

left:50%;

transform:translateX(-50%);

z-index:1000;


padding:15px 45px;


border:none;

border-radius:40px;


cursor:pointer;


font-size:18px;

font-weight:bold;


color:white;


background:

linear-gradient(
90deg,
#ff0055,
#ff79bc
);



box-shadow:

0 0 25px #ff3b8d;


transition:transform .35s, box-shadow .35s;

will-change:transform;

}




#nextBtn:hover{

transform:translateX(-50%) scale(1.08);

}





/* ==========================
EFFECT CONTAINERS
========================== */


#smokeContainer,
#confettiContainer,
#fireworksContainer,
#balloonContainer,
#heartContainer,
#sparkleContainer{


position:fixed;

inset:0;


pointer-events:none;


overflow:hidden;


z-index:20;

}





/* SMOKE */


.smoke{

position:absolute;


width:18px;

height:18px;


border-radius:50%;


background:
rgba(255,255,255,.7);


animation:
smokeRise 2.5s forwards;

will-change:transform, opacity;

}



@keyframes smokeRise{


to{

opacity:0;


transform:

translate(var(--x),-130px)
scale(2.5);

}

}




/* PARTICLES */


.confetti{

position:absolute;

width:8px;

height:15px;

border-radius:3px;

will-change:transform, opacity;

}



.balloon{

position:absolute;

font-size:36px;

will-change:transform;

}



.heart{

position:absolute;

font-size:26px;

will-change:transform, opacity;

}



.sparkle{

position:absolute;

font-size:18px;

will-change:transform, opacity;

}




/* MOBILE */


@media(max-width:600px){


.cake{

transform:scale(.82);

}



#birthdayTitle{

font-size:38px;

}



.blowCard{

padding:18px 22px;

}



.blowCard h2{

font-size:22px;

}



#status{

font-size:15px;

}



#nextBtn{

bottom:30px;

padding:14px 38px;

font-size:16px;

}


}

</style>

</head>
<body>


<div id="stars"></div>


<div id="smokeContainer"></div>

<div id="confettiContainer"></div>

<div id="fireworksContainer"></div>

<div id="balloonContainer"></div>

<div id="heartContainer"></div>

<div id="sparkleContainer"></div>



<div class="container">



<h1 id="birthdayTitle">

🎉 Happy Birthday<br>

Sholankini 🎂

</h1>




<div class="cake" id="cake">



<div class="candles">


<div class="candle">

<div class="flame"></div>

</div>


<div class="candle">

<div class="flame"></div>

</div>


<div class="candle">

<div class="flame"></div>

</div>


</div>




<div class="layer top-layer">

<div class="icing"></div>

</div>


<div class="layer middle-layer">

<div class="icing"></div>

</div>


<div class="layer bottom-layer">

<div class="icing"></div>

</div>



</div>





<div class="blowCard" id="blowCard">


<h2>

💨 Blow the Candles

</h2>


<p id="status">

Tap anywhere to start microphone

</p>


</div>





<button id="nextBtn">

Continue →

</button>



</div>




<script>


const cake=document.getElementById("cake");

const birthdayTitle=document.getElementById("birthdayTitle");

const status=document.getElementById("status");

const nextBtn=document.getElementById("nextBtn");

const blowCard=document.getElementById("blowCard");


const flames=document.querySelectorAll(".flame");


const smokeContainer=document.getElementById("smokeContainer");

const confettiContainer=document.getElementById("confettiContainer");

const fireworksContainer=document.getElementById("fireworksContainer");

const balloonContainer=document.getElementById("balloonContainer");

const heartContainer=document.getElementById("heartContainer");

const sparkleContainer=document.getElementById("sparkleContainer");



let blown=false;




// CREATE STARS

createStars();


function createStars(){


const stars=document.getElementById("stars");


for(let i=0;i<60;i++){


const star=document.createElement("div");


star.className="star";


star.style.left=Math.random()*100+"vw";


star.style.top=Math.random()*100+"vh";


star.style.animationDelay=Math.random()*3+"s";


stars.appendChild(star);


}


}







// START MICROPHONE


document.body.addEventListener(

"click",

startMicrophone,

{once:true}

);





async function startMicrophone(){


try{


const stream=

await navigator.mediaDevices.getUserMedia({

audio:true

});



status.innerHTML=

"🎤 Listening... Blow gently 💨";



const audioContext=

new AudioContext();



const microphone=

audioContext.createMediaStreamSource(stream);



const analyser=

audioContext.createAnalyser();



microphone.connect(analyser);



analyser.fftSize=128;



const data=

new Uint8Array(

analyser.frequencyBinCount

);



detectBlow(analyser,data);



}


catch(error){


status.innerHTML=

"❌ Microphone permission denied";


}


}






// BLOW DETECTION


function detectBlow(analyser,data){


analyser.getByteFrequencyData(data);


let volume=0;



for(let i=0;i<data.length;i++){


volume+=data[i];

}



volume/=data.length;




if(volume>18 && !blown){


blown=true;


blowCandles();


return;


}




requestAnimationFrame(()=>{

detectBlow(analyser,data);

});


}






// BLOW CANDLES


function blowCandles(){


blowCard.style.opacity="0";


setTimeout(()=>{

blowCard.style.display="none";

},600);




flames.forEach((flame,index)=>{


setTimeout(()=>{


flame.animate([

{
opacity:1,
transform:
"translateX(-50%) rotate(45deg) scale(1)"
},

{
opacity:0,
transform:
"translateX(-50%) rotate(45deg) scale(0)"
}

],{


duration:500,

fill:"forwards"

});



createSmoke(flame);



},index*200);


});



setTimeout(()=>{

screenFlash();

},1000);



}





// SMOKE


function createSmoke(flame){


const rect=flame.getBoundingClientRect();



for(let i=0;i<8;i++){


const puff=document.createElement("div");


puff.className="smoke";


puff.style.left=rect.left+"px";


puff.style.top=rect.top+"px";


puff.style.setProperty(

"--x",

(Math.random()-0.5)*80+"px"

);



smokeContainer.appendChild(puff);



setTimeout(()=>{

puff.remove();

},2500);



}


}



// SCREEN FLASH

function screenFlash(){


const flash=document.createElement("div");


flash.style.position="fixed";

flash.style.inset="0";

flash.style.background="white";

flash.style.opacity="0";

flash.style.zIndex="9999";

flash.style.pointerEvents="none";


document.body.appendChild(flash);



flash.animate([

{
opacity:0
},

{
opacity:.8
},

{
opacity:0
}

],{

duration:500,

fill:"forwards"

});



cake.animate([

{
transform:"scale(1)",
opacity:1
},

{
transform:"scale(.3)",
opacity:0
}

],{

duration:1200,

fill:"forwards"

});



setTimeout(()=>{


cake.style.display="none";


launchConfetti();


},1000);


}







// CONFETTI

function launchConfetti(){


for(let i=0;i<100;i++){


const piece=document.createElement("div");


piece.className="confetti";


piece.style.left=Math.random()*100+"vw";


piece.style.top="-20px";


piece.style.background=
`hsl(${Math.random()*360},100%,60%)`;



confettiContainer.appendChild(piece);



piece.animate([

{
transform:"translateY(0) rotate(0)",
opacity:1
},


{

transform:
`translate(${(Math.random()-0.5)*400}px,110vh)
rotate(720deg)`,

opacity:1

}

],{


duration:2500+Math.random()*1500,

fill:"forwards"

});



setTimeout(()=>{

piece.remove();

},4000);


}




setTimeout(()=>{


launchFireworks();

launchBalloons();

launchHearts();

launchSparkles();

revealBirthday();



},1200);


}







// FIREWORKS (SINGLE ONE-TIME BURST)

function launchFireworks(){


const fireworkPositions=[
{left:"20vw",top:"30vh"},
{left:"50vw",top:"20vh"},
{left:"80vw",top:"30vh"}
];



fireworkPositions.forEach((pos)=>{


const fire=document.createElement("div");


fire.innerHTML="🎆";


fire.style.position="fixed";


fire.style.left=pos.left;


fire.style.top=pos.top;


fire.style.fontSize="50px";


fireworksContainer.appendChild(fire);



fire.animate([


{
opacity:0,
transform:"scale(.2)"
},


{
opacity:1,
transform:"scale(1.5)"
},


{
opacity:0,
transform:"scale(2.2)"
}


],{

duration:1000,

fill:"forwards"

});



setTimeout(()=>{

fire.remove();

},1000);



});


}







// BALLOONS


function launchBalloons(){


for(let i=0;i<8;i++){


const balloon=document.createElement("div");


balloon.className="balloon";


balloon.innerHTML="🎈";


balloon.style.left=Math.random()*100+"vw";


balloon.style.bottom="-50px";


balloonContainer.appendChild(balloon);



balloon.animate([

{
transform:"translateY(0)"
},

{
transform:"translateY(-120vh)"
}

],{

duration:7000,

fill:"forwards"

});



setTimeout(()=>{

balloon.remove();

},7500);


}


}







// HEARTS

function launchHearts(){


for(let i=0;i<8;i++){


const heart=document.createElement("div");


heart.className="heart";


heart.innerHTML="💖";


heart.style.left=Math.random()*100+"vw";


heart.style.bottom="-30px";


heartContainer.appendChild(heart);



heart.animate([

{
transform:"translateY(0)",
opacity:1
},

{
transform:"translateY(-100vh)",
opacity:0
}

],{

duration:4000,

fill:"forwards"

});



setTimeout(()=>{

heart.remove();

},4000);


}


}







// SPARKLES

function launchSparkles(){


for(let i=0;i<15;i++){


const sparkle=document.createElement("div");


sparkle.className="sparkle";


sparkle.innerHTML="✨";


sparkle.style.left=Math.random()*100+"vw";


sparkle.style.top="-20px";


sparkleContainer.appendChild(sparkle);



sparkle.animate([

{
transform:"translateY(0)",
opacity:1
},

{
transform:"translateY(100vh)",
opacity:0
}

],{

duration:3000,

fill:"forwards"

});



setTimeout(()=>{

sparkle.remove();

},3000);


}


}







// TITLE REVEAL


function revealBirthday(){


birthdayTitle.style.display="block";



birthdayTitle.animate([

{
opacity:0,

transform:
"translate(-50%,-50%) scale(.2)"

},


{
opacity:1,

transform:
"translate(-50%,-50%) scale(1)"

}

],{

duration:1800,

fill:"forwards"

});



setTimeout(()=>{


status.innerHTML=
"🎉 Happy Birthday Sholankini! 🎂";


nextBtn.style.display="block";


},1500);


}







// NEXT BUTTON


nextBtn.onclick=()=>{


window.location.href="page3.html";


};



</script>


</body>

</html>
