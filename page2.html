<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Cake 🎂</title>


<style>

*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;

}


body{

height:100vh;

overflow:hidden;

display:flex;

justify-content:center;

align-items:center;

background:

linear-gradient(
135deg,
#050505,
#19000c,
#5c0025,
#ff174f
);

color:white;

}



/* BACKGROUND GLOW */


body::before{

content:"";

position:absolute;

width:600px;

height:600px;

background:

radial-gradient(
circle,
rgba(255,70,150,.45),
transparent 70%
);

animation:

glow 5s infinite alternate;

}


@keyframes glow{


from{

transform:scale(1);

opacity:.5;

}


to{

transform:scale(1.4);

opacity:1;

}


}



/* MAIN CONTAINER */


.container{

position:relative;

z-index:5;

text-align:center;

}



/* TITLE */


h1{

font-size:40px;

margin-bottom:40px;

color:#ffd1e8;

text-shadow:

0 0 15px #ff69b4,

0 0 35px #ff174f;

animation:

titlePulse 2s infinite;

}


@keyframes titlePulse{


50%{

transform:scale(1.05);

}

}
/* CAKE */


.cake{

position:relative;

width:260px;

height:220px;

margin:auto;

animation:

cakeBounce 3s infinite;

}



@keyframes cakeBounce{


50%{

transform:translateY(-15px);

}


}



/* CAKE LAYERS */


.layer{

position:absolute;

left:50%;

transform:translateX(-50%);

border-radius:15px;

box-shadow:

0 10px 25px rgba(0,0,0,.6);

}



.bottom-layer{

bottom:0;

width:250px;

height:70px;

background:

linear-gradient(
180deg,
#ff7abf,
#d40052
);

}



.middle-layer{

bottom:60px;

width:210px;

height:60px;

background:

linear-gradient(
180deg,
#ffc1e3,
#ff3d91
);

}



.top-layer{

bottom:110px;

width:160px;

height:55px;

background:

linear-gradient(
180deg,
#ffffff,
#ff8ac5
);

}



/* ICING */


.icing{

position:absolute;

top:-8px;

width:100%;

height:18px;

border-radius:50%;

background:

linear-gradient(
90deg,
#ffffff,
#ffd1e8
);

}



/* CANDLES */


.candles{

position:absolute;

top:-55px;

left:50%;

transform:translateX(-50%);

display:flex;

gap:25px;

}



.candle{

width:12px;

height:55px;

border-radius:5px;

position:relative;

background:

linear-gradient(
90deg,
#ff174f,
#ff8ac5
);

opacity:0;

animation:

riseCandle 1s forwards;

}



.candle:nth-child(1){

animation-delay:.5s;

}


.candle:nth-child(2){

animation-delay:1s;

}


.candle:nth-child(3){

animation-delay:1.5s;

}



@keyframes riseCandle{


from{

transform:translateY(40px);

opacity:0;

}


to{

transform:translateY(0);

opacity:1;

}

}



/* FLAMES */


.flame{

position:absolute;

top:-25px;

left:50%;

transform:translateX(-50%) rotate(45deg);

width:17px;

height:25px;

background:

linear-gradient(
orange,
yellow
);

border-radius:

50% 50% 50% 0;

box-shadow:

0 0 15px orange,

0 0 35px red;

animation:

flicker .35s infinite alternate;

}



@keyframes flicker{


from{

transform:
translateX(-50%)
rotate(45deg)
scale(1);

}


to{

transform:
translateX(-50%)
rotate(45deg)
scale(1.25);

}


}
/* BLOW CARD */


.blow-card{

margin-top:35px;

padding:20px 40px;

border-radius:30px;

background:

rgba(255,255,255,.08);

border:

1px solid rgba(255,255,255,.2);

box-shadow:

0 0 30px rgba(255,23,79,.5);

backdrop-filter:

blur(15px);

animation:

floatBlow 2s infinite;

}



.wind-icon{

font-size:45px;

animation:

windMove 1.5s infinite;

}



.blow-text{

margin-top:10px;

font-size:22px;

font-weight:bold;

color:#ffd1e8;

}



.mic-status{

margin-top:8px;

font-size:14px;

color:#ff8ac5;

}



@keyframes floatBlow{


50%{

transform:translateY(-8px);

}

}



@keyframes windMove{


50%{

transform:translateX(12px);

}

}



/* NEXT BUTTON */


#next{

margin-top:25px;

padding:12px 35px;

border:none;

border-radius:30px;

background:

linear-gradient(
90deg,
#ff174f,
#ff69b4
);

color:white;

font-size:18px;

box-shadow:

0 0 25px #ff174f;

cursor:pointer;

}



/* MOBILE */


@media(max-width:600px){


h1{

font-size:30px;

}


.cake{

transform:scale(.85);

}


.blow-card{

padding:18px 25px;

}


}

</style>

</head>
<body>


<div class="container">


<h1>

Happy Birthday Sholankini 🎂

</h1>



<div class="cake">



<div class="candles">


<div class="candle">

<div class="flame"></div>

</div>



<div class="candle">

<div class="flame"></div>

</div>



<div class="candle">

<div class="flame"></div>

</div>



</div>




<div class="layer top-layer">

<div class="icing"></div>

</div>



<div class="layer middle-layer">

<div class="icing"></div>

</div>



<div class="layer bottom-layer">

<div class="icing"></div>

</div>



</div>




<div class="blow-card">


<div class="wind-icon">

💨

</div>


<div class="blow-text">

Blow gently...

</div>


<div class="mic-status" id="micStatus">

Tap anywhere to start listening ✨

</div>


</div>




<button id="next" style="display:none;">

Next Page →

</button>



</div>
<script>


const flames =
document.querySelectorAll(".flame");


const micStatus =
document.getElementById("micStatus");


const next =
document.getElementById("next");



let blown = false;



document.body.addEventListener(
"click",
startMic,
{once:true}
);



async function startMic(){


try{


const stream =
await navigator.mediaDevices.getUserMedia(
{
audio:true
}
);



micStatus.innerHTML =
"Listening... Blow 💨";



const audioContext =
new AudioContext();



const microphone =
audioContext.createMediaStreamSource(stream);



const analyser =
audioContext.createAnalyser();



microphone.connect(analyser);



analyser.fftSize = 256;



const data =
new Uint8Array(
analyser.frequencyBinCount
);



function detectBlow(){


analyser.getByteFrequencyData(data);



let volume =
data.reduce(
(sum,value)=>sum+value,
0
) / data.length;



if(volume > 20 && !blown){


blown = true;


extinguish();


}



requestAnimationFrame(
detectBlow
);



}



detectBlow();



}


catch(error){


micStatus.innerHTML =
"Microphone unavailable";


}


}




function extinguish(){



flames.forEach(
(flame,index)=>{


setTimeout(()=>{


flame.style.animation =
"none";


flame.style.opacity =
"0";


},index*300);


}
);



micStatus.innerHTML =
"🎉 Candles blown! 🎉";



next.style.display =
"inline-block";



}




next.onclick=function(){


window.location.href =
"page3.html";


};



</script>



</body>

</html>
