<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Celebration 🎉</title>


<style>

*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;

}


body{

height:100vh;

overflow:hidden;

display:flex;

justify-content:center;

align-items:center;

background:

linear-gradient(
135deg,
#050505,
#21000f,
#7a0030,
#ff174f
);

color:white;

}



/* BACKGROUND GLOW */


body::before{

content:"";

position:absolute;

width:600px;

height:600px;

background:

radial-gradient(
circle,
rgba(255,105,180,.5),
transparent 70%
);

animation:

glow 5s infinite alternate;

}


@keyframes glow{


from{

transform:scale(1);

}


to{

transform:scale(1.5);

}


}



/* CONTAINER */


.container{

position:relative;

z-index:5;

text-align:center;

padding:35px;

width:90%;

max-width:500px;

background:

rgba(255,255,255,.08);

border:

1px solid rgba(255,255,255,.2);

border-radius:30px;

backdrop-filter:

blur(15px);

box-shadow:

0 0 40px rgba(255,23,79,.6);

animation:

entry 1.5s ease;

}



@keyframes entry{

from{

opacity:0;

transform:translateY(50px) scale(.8);

}


to{

opacity:1;

transform:translateY(0) scale(1);

}

}
/* HEADING */


h1{

font-size:42px;

color:#ffb6dc;

text-shadow:

0 0 15px #ff69b4,

0 0 35px #ff174f;

animation:

headingGlow 2s infinite;

}



@keyframes headingGlow{


50%{

transform:scale(1.08);

text-shadow:

0 0 30px #ff174f,

0 0 60px #ff69b4;

}

}



/* MESSAGE */


.message{

margin-top:25px;

font-size:20px;

line-height:1.6;

color:#ffe5f0;

animation:

fadeText 2s ease;

}



@keyframes fadeText{


from{

opacity:0;

}


to{

opacity:1;

}

}



/* CONFETTI */


.confetti{

position:absolute;

top:-20px;

width:12px;

height:20px;

animation:

fall 4s linear infinite;

}



@keyframes fall{


0%{

transform:

translateY(-20px)
rotate(0deg);

}


100%{

transform:

translateY(110vh)
rotate(720deg);

}

}



/* HEARTS */


.heart{

position:absolute;

bottom:-40px;

font-size:25px;

animation:

heartFloat 7s linear infinite;

}



@keyframes heartFloat{


0%{

transform:

translateY(0)
scale(.5);

opacity:0;

}


20%{

opacity:1;

}


100%{

transform:

translateY(-120vh)
scale(1.5);

opacity:0;

}

}



/* BUTTON */


.next-btn{

margin-top:30px;

padding:

14px 35px;

border:none;

border-radius:30px;

background:

linear-gradient(
90deg,
#ff174f,
#ff69b4
);

color:white;

font-size:18px;

cursor:pointer;

box-shadow:

0 0 25px #ff174f;

transition:.3s;

}



.next-btn:hover{

transform:scale(1.1);

}
</style>

</head>


<body>



<!-- CONFETTI -->


<div class="confetti"
style="
left:10%;
background:#ff174f;
animation-delay:0s;
"></div>


<div class="confetti"
style="
left:25%;
background:#ff69b4;
animation-delay:1s;
"></div>


<div class="confetti"
style="
left:40%;
background:#ffd700;
animation-delay:2s;
"></div>


<div class="confetti"
style="
left:60%;
background:#00ffff;
animation-delay:.5s;
"></div>


<div class="confetti"
style="
left:80%;
background:#ffffff;
animation-delay:1.5s;
"></div>



<!-- FLOATING HEARTS -->


<div class="heart" style="left:15%;animation-delay:1s;">
❤️
</div>


<div class="heart" style="left:45%;animation-delay:3s;">
💗
</div>


<div class="heart" style="left:75%;animation-delay:2s;">
💖
</div>





<div class="container">



<h1>

🎉 Celebration Time 🎉

</h1>




<div class="message">


Happy Birthday Sholanjari! 🎂


<br><br>


May all your dreams come true.

<br>


Keep smiling and keep shining ❤️


</div>




<button class="next-btn" id="nextPage">

Next Page →

</button>



</div>




<script>


const button =
document.getElementById("nextPage");



button.onclick=function(){


window.location.href =
"page4.html";


};



/* More confetti generator */


function createConfetti(){


const c =
document.createElement("div");


c.className =
"confetti";


c.style.left =
Math.random()*100+"%";


c.style.background =
[
"#ff174f",
"#ff69b4",
"#ffd700",
"#00ffff",
"#ffffff"
][
Math.floor(
Math.random()*5
)
];


c.style.animationDuration =
(3+Math.random()*3)+"s";



document.body.appendChild(c);



setTimeout(()=>{

c.remove();

},6000);



}



setInterval(
createConfetti,
200
);



</script>


</body>


</html>
