<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Memories 📖</title>

<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Poppins:wght@700;900&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

min-height:100vh;

background:#050505;

color:white;

display:flex;

justify-content:center;

align-items:center;

overflow-x:hidden;

font-family:Poppins,sans-serif;

}



/* glowing background */

body::before{

content:"";

position:absolute;

width:500px;

height:500px;

background:#ff0055;

filter:blur(160px);

opacity:.25;

animation:glow 5s infinite alternate;

}



@keyframes glow{

from{

transform:translate(-100px,-100px);

}

to{

transform:translate(100px,100px);

}

}




.container{

position:relative;

z-index:2;

width:90%;

max-width:700px;

text-align:center;

padding:30px;

}




.title{

font-size:clamp(2rem,6vw,4rem);

font-weight:900;

text-shadow:

0 0 25px #ff0055;

animation:title .8s;

}



@keyframes title{

from{

opacity:0;

transform:translateY(-50px);

}

to{

opacity:1;

transform:translateY(0);

}

}





.note{

background:

linear-gradient(
135deg,
#151515,
#080808
);

border:2px solid #ff0055;

border-radius:25px;

padding:30px;

margin:35px 0;

box-shadow:

0 0 35px rgba(255,0,85,.35);

position:relative;

animation:notePop .8s forwards;

opacity:0;

}



.note:nth-child(2){

animation-delay:.5s;

}


.note:nth-child(3){

animation-delay:1s;

}



@keyframes notePop{

0%{

opacity:0;

transform:

translateY(80px)
rotate(-5deg)
scale(.7);

}

100%{

opacity:1;

transform:

translateY(0)
rotate(0)
scale(1);

}

}




.pin{

position:absolute;

top:-15px;

left:50%;

transform:translateX(-50%);

width:25px;

height:25px;

background:#ff0055;

border-radius:50%;

box-shadow:

0 0 20px #ff0055;

}





.note h2{

font-family:Caveat,cursive;

font-size:3rem;

color:#ff0055;

}



.note p{

font-family:Caveat,cursive;

font-size:1.8rem;

margin-top:10px;

}




.photo-box{

height:130px;

width:130px;

margin:20px auto;

border-radius:20px;

border:2px dashed #ff0055;

display:flex;

align-items:center;

justify-content:center;

font-size:50px;

background:#000;

box-shadow:

inset 0 0 25px #ff0055;

}




button{

margin-top:25px;

padding:18px 65px;

border-radius:50px;

border:3px solid #ff0055;

background:#000;

color:white;

font-size:1.3rem;

font-weight:900;

cursor:pointer;

box-shadow:

0 0 30px #ff0055;

animation:pulse 2s infinite;

transition:.4s;

}



button:hover{

background:#ff0055;

transform:scale(1.1);

}



@keyframes pulse{

50%{

box-shadow:

0 0 60px #ff0055;

}

}



</style>

</head>


<body>


<div class="container">


<h1 class="title">

Our Memories 📖✨

</h1>




<div class="note">

<div class="pin"></div>


<h2>Memory 01</h2>

<p>

Gundi Forever 😌❤️

</p>


<div class="photo-box">

<img src="IMG-20260603-WA0100.jpg">

</div>


<p>

Our fun gundi moments ✨

</p>


</div>







<div class="note">

<div class="pin"></div>


<h2>Memory 02</h2>

<p>

Favourite Sticker 🥹

</p>


<div class="photo-box">

🥰

</div>


<p>

The sticker that always reminds me of you 💗

</p>


</div>





<button onclick="location.href='page8.html'">

CONTINUE ✨

</button>



</div>


</body>
</html>
