<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Do You Still Love Ishanjit???</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:white;
    font-family:'Plus Jakarta Sans',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    position:relative;
}


/* Background Glow */

.background-animations{
    position:absolute;
    width:100%;
    height:100%;
    z-index:0;
}

.orb{
    position:absolute;
    border-radius:50%;
    filter:blur(80px);
    opacity:0;
    animation:orbPop 10s infinite ease-in-out;
}


.orb-1{
    width:400px;
    height:400px;
    background:rgba(255,0,85,.4);
    top:-100px;
    left:-100px;
}

.orb-2{
    width:500px;
    height:500px;
    background:rgba(255,50,50,.3);
    bottom:-150px;
    right:-100px;
    animation-delay:3s;
}


.orb-3{
    width:300px;
    height:300px;
    background:rgba(150,0,50,.5);
    top:60%;
    left:20%;
    animation-delay:6s;
}


@keyframes orbPop{

0%{
transform:scale(.5);
opacity:0;
}

20%{
transform:scale(1);
opacity:.8;
}

50%{
transform:scale(1.1);
opacity:.5;
}

80%{
opacity:.7;
}

100%{
transform:scale(.5);
opacity:0;
}

}



/* Content */

.container{
    position:relative;
    z-index:2;
    text-align:center;
    width:90%;
}


.question-wrapper{

font-family:'Cinzel',serif;
font-size:clamp(2rem,5vw,4rem);
min-height:170px;

display:flex;
flex-wrap:wrap;
justify-content:center;
align-items:center;

letter-spacing:2px;

text-shadow:0 0 20px rgba(255,0,85,.3);

}



.char{

opacity:0;
display:inline-block;

transform:
translateY(15px)
scale(.95);

animation:textShow .4s forwards;

}


.space{
width:.35em;
}


.highlight-red{

color:#ff0055;

text-shadow:
0 0 25px #ff0055,
0 0 50px rgba(255,0,85,.7);

}



@keyframes textShow{

to{

opacity:1;

transform:
translateY(0)
scale(1);

}

}




/* Buttons */

.btn-group{

display:flex;
justify-content:center;
gap:40px;

opacity:0;

transform:translateY(30px);

transition:1s;

pointer-events:none;

}


.btn-group.visible{

opacity:1;

transform:translateY(0);

pointer-events:auto;

}



.btn{

background:#000;

color:white;

border:3px solid #ff0055;

padding:18px 55px;

font-size:1.5rem;

font-weight:800;

letter-spacing:3px;

border-radius:50px;

text-decoration:none;

text-shadow:
0 0 15px #ff0055;

box-shadow:
0 0 20px rgba(255,0,85,.4);

transition:.4s;

}



.btn:hover{

background:#ff0055;

transform:translateY(-5px) scale(1.05);

box-shadow:
0 0 50px #ff0055;

}



@media(max-width:600px){

body{
overflow-y:auto;
}


.btn-group{

flex-direction:column;

gap:20px;

}


.btn{

width:80%;

margin:auto;

font-size:1.2rem;

}

}

</style>

</head>


<body>


<div class="background-animations">

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

</div>



<div class="container">


<div class="question-wrapper" id="animatedText"></div>


<div class="btn-group" id="btnGroup">

<a href="page6.html" class="btn">YES</a>

<a href="page5.html" class="btn">NO</a>

</div>


</div>



<script>


const text="Do You Still Love Ishanjit???";

const box=document.getElementById("animatedText");

const buttons=document.getElementById("btnGroup");


const speed=90;



text.split("").forEach((letter,index)=>{


let span=document.createElement("span");


if(letter===" "){

span.className="space";

}

else{

span.className="char";

span.textContent=letter;

span.style.animationDelay=
`${index*speed}ms`;


// Highlight Ishanjit + ???

if(index>=16 && index<=23 || letter==="?"){

span.classList.add("highlight-red");

}

}


box.appendChild(span);


});



setTimeout(()=>{

buttons.classList.add("visible");

},(text.length*speed)+500);



</script>


</body>
</html>
